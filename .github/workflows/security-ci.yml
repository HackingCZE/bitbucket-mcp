name: Security CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["security/readonly-default"]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build hardened entrypoint
        run: npm run build

      - name: Verify hardened build layout
        run: |
          test -f dist/index.js
          test -f dist/core.js
          grep -q "hardened-proxy" dist/index.js || grep -q "Blocked tool call" dist/index.js
