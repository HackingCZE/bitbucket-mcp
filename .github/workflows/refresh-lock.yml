name: Temporary Lockfile Rebuild

on:
  push:
    branches: ["security/readonly-default"]

permissions:
  contents: write

jobs:
  rebuild-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout hardened branch
        uses: actions/checkout@v5
        with:
          ref: security/readonly-default

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rebuild lockfile from package.json without package scripts
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Prove lockfile is internally consistent
        run: npm ci --ignore-scripts

      - name: Verify production audit before commit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit rebuilt lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Rebuild audited lockfile for hardened dependencies"
          git push origin HEAD:security/readonly-default
