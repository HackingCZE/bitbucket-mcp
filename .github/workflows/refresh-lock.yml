name: Temporary Audit Lockfile Fix

on:
  push:
    branches: ["security/readonly-default"]

permissions:
  contents: write

jobs:
  audit-fix-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/readonly-default

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking npm audit lockfile fixes
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile audit fixes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile audit fix required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply non-breaking npm audit lockfile fixes"
          git push origin HEAD:security/readonly-default
