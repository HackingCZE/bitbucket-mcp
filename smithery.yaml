# Smithery.ai configuration
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      BITBUCKET_URL:
        type: string
        description: "Bitbucket API URL (defaults to https://api.bitbucket.org/2.0)"
        default: "https://api.bitbucket.org/2.0"
      BITBUCKET_TOKEN:
        type: string
        description: "Bitbucket access token for authentication. Prefer a read-only token."
      BITBUCKET_USERNAME:
        type: string
        description: "Bitbucket username (used with password authentication)"
      BITBUCKET_PASSWORD:
        type: string
        description: "Bitbucket app password/API token (used with username authentication)"
        format: password
      BITBUCKET_WORKSPACE:
        type: string
        description: "Default Bitbucket workspace to use when not specified"
      BITBUCKET_ENABLE_WRITE:
        type: string
        description: "Explicit opt-in for non-read operations. Default is false/read-only."
        default: "false"
      BITBUCKET_ENABLE_DANGEROUS:
        type: string
        description: "Second opt-in for destructive delete operations; requires BITBUCKET_ENABLE_WRITE=true"
        default: "false"
      BITBUCKET_PROXY_DEBUG:
        type: string
        description: "Enable minimal credential-redacted proxy diagnostics on stderr"
        default: "false"
    oneOf:
      - required: ["BITBUCKET_TOKEN"]
      - required: ["BITBUCKET_USERNAME", "BITBUCKET_PASSWORD"]
  commandFunction: |-
    (config) => {
      const env = Object.assign({}, process.env);
      env.NODE_ENV = 'production';

      if (config.BITBUCKET_URL) env.BITBUCKET_URL = config.BITBUCKET_URL;
      if (config.BITBUCKET_TOKEN) env.BITBUCKET_TOKEN = config.BITBUCKET_TOKEN;
      if (config.BITBUCKET_USERNAME) env.BITBUCKET_USERNAME = config.BITBUCKET_USERNAME;
      if (config.BITBUCKET_PASSWORD) env.BITBUCKET_PASSWORD = config.BITBUCKET_PASSWORD;
      if (config.BITBUCKET_WORKSPACE) env.BITBUCKET_WORKSPACE = config.BITBUCKET_WORKSPACE;
      if (config.BITBUCKET_ENABLE_WRITE) env.BITBUCKET_ENABLE_WRITE = config.BITBUCKET_ENABLE_WRITE;
      if (config.BITBUCKET_ENABLE_DANGEROUS) env.BITBUCKET_ENABLE_DANGEROUS = config.BITBUCKET_ENABLE_DANGEROUS;
      if (config.BITBUCKET_PROXY_DEBUG) env.BITBUCKET_PROXY_DEBUG = config.BITBUCKET_PROXY_DEBUG;

      // Hardened entrypoint disables the legacy core file logger unconditionally.
      env.BITBUCKET_LOG_DISABLE = 'true';
      delete env.BITBUCKET_LOG_FILE;
      delete env.BITBUCKET_LOG_DIR;
      delete env.BITBUCKET_LOG_PER_CWD;

      return { command: 'node', args: ['dist/index.js'], env };
    }
build:
  dockerfile: "./Dockerfile"
  dockerBuildPath: "."
